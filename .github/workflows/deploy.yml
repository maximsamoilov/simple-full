name: Deploy

on:
  workflow_run:
    workflows: ['Check']
    types: [completed]
    branches: ['main']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: eu-central-1
  ALB_DNS_NAME: simple-full-alb-1593590786.eu-central-1.elb.amazonaws.com

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/simple-full-backend
          tags: type=raw,value=latest

      - name: Docker metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/simple-full-frontend
          tags: type=raw,value=latest

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition simple-full-backend \
            --query taskDefinition \
            > /tmp/backend-task-def.json

      - name: Download frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition simple-full-frontend \
            --query taskDefinition \
            > /tmp/frontend-task-def.json

      - name: Update backend image in task definition
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/backend-task-def.json
          container-name: backend
          image: ${{ secrets.DOCKERHUB_USERNAME }}/simple-full-backend:latest

      - name: Update frontend image in task definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/frontend-task-def.json
          container-name: frontend
          image: ${{ secrets.DOCKERHUB_USERNAME }}/simple-full-frontend:latest

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: simple-full-backend
          cluster: simple-full-cluster
          wait-for-service-stability: true

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: simple-full-frontend
          cluster: simple-full-cluster
          wait-for-service-stability: true

      - name: Deployment Summary
        run: |
          echo "### Deployment successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: [http://${{ env.ALB_DNS_NAME }}](http://${{ env.ALB_DNS_NAME }})" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: [http://${{ env.ALB_DNS_NAME }}/api](http://${{ env.ALB_DNS_NAME }}/api)" >> $GITHUB_STEP_SUMMARY
